name: Future Release Trust

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the already-selected tag as a GitHub Release"
        required: true
        default: false
        type: boolean

# Pull requests cannot enter this workflow.  A tag push builds and attests but
# does not publish; publication requires a manual dispatch plus the protected
# release-publication environment.
permissions: {}

jobs:
  build-package:
    name: Build, verify, package, and prepare release evidence
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TIMESTAMP: ${{ github.run_started_at }}

    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag and checkout identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release workflow requires an exact vX.Y.Z tag ref: $env:GITHUB_REF"
          }
          if ($env:RELEASE_TAG -eq "v0.1.0") {
            throw "v0.1.0 is historical and is intentionally excluded from future provenance"
          }
          python scripts/release_trust.py validate-tag --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checked-out commit $head does not match workflow SHA $env:GITHUB_SHA"
          }
          Write-Output "Release tag: $env:RELEASE_TAG"
          Write-Output "Release commit: $head"

      - name: Build, test, package, and verify release trust evidence
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          & pwsh -NoProfile -File scripts/windows_release_trust.ps1 `
            -Mode release `
            -Version $version `
            -BuildDirectory build `
            -ReleaseDirectory release `
            -Tag $env:RELEASE_TAG `
            -Commit $env:GITHUB_SHA `
            -Timestamp $env:RELEASE_TIMESTAMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release evidence for attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coreguard-${{ github.ref_name }}-release-evidence-build
          path: release/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified release evidence
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coreguard-${{ github.ref_name }}-release-evidence-build
          path: release

      - name: Resolve exact attestation subjects
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release"
          $zipFiles = @(Get-ChildItem -LiteralPath $releaseRoot -Filter "coreguard-*.zip" -File)
          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one release ZIP, found $($zipFiles.Count)"
          }
          foreach ($required in @("SHA256SUMS", "release-manifest.json")) {
            if (-not (Test-Path -LiteralPath (Join-Path $releaseRoot $required))) {
              throw "Missing attestation subject: $required"
            }
          }
          "COREGUARD_RELEASE_ZIP=$($zipFiles[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest release ZIP and checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ env.COREGUARD_RELEASE_ZIP }}
            ${{ github.workspace }}/release/SHA256SUMS
            ${{ github.workspace }}/release/release-manifest.json

      - name: Upload attested release evidence for owner-gated publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coreguard-${{ github.ref_name }}-release-evidence-attested
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Owner-gated GitHub Release publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: attest
    runs-on: ubuntu-latest
    environment:
      name: release-publication
    permissions:
      contents: write
    steps:
      - name: Download attested release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coreguard-${{ github.ref_name }}-release-evidence-attested
          path: release

      - name: Publish existing tag without creating a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "Coreguard ${{ github.ref_name }}" \
            --generate-notes \
            release/*
